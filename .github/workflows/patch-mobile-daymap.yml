name: Patch mobile day map

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-daymap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')

          old = ".leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111820;color:#f4efe8}.leaflet-popup-content a{color:var(--gold)}.leaflet-control-attribution{font-size:9px!important}footer"
          new = ".leaflet-popup{max-width:195px!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111820;color:#f4efe8}.leaflet-popup-content-wrapper{border-radius:12px}.leaflet-popup-content{margin:8px 10px!important;line-height:1.35;font-size:.72rem;max-width:165px!important;min-width:0!important}.leaflet-popup-content b{font-size:.78rem}.leaflet-popup-content a{color:var(--gold);font-size:.69rem}.leaflet-popup-close-button{width:24px!important;height:24px!important;font-size:18px!important;line-height:22px!important}.leaflet-control-attribution{font-size:9px!important}footer"
          assert old in t
          t = t.replace(old, new)

          old = ".mobilemap{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px;color:var(--muted);font-size:.69rem}.mobilemap button{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:#ddd;padding:5px 8px;font:inherit;font-size:.65rem}#map"
          new = ".mobilemap{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 6px;color:var(--muted);font-size:.69rem}.mobilemap .mapmini-actions{display:flex;gap:5px;flex-shrink:0}.mobilemap button{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:#ddd;padding:5px 8px;font:inherit;font-size:.65rem;white-space:nowrap}.mobilemap button.active{background:rgba(230,106,84,.13);border-color:rgba(230,106,84,.55);color:#f0c1b8}#map"
          assert old in t
          t = t.replace(old, new)

          old = '<div class="workspace"><aside class="mapbox"><div class="mobilemap"><span>🗺 일정 누르면 지도 자동 이동</span><button id="mapsize">지도 크게</button></div><div id="map"></div>'
          new = '<div class="workspace"><aside class="mapbox"><div class="mobilemap"><span id="daymaplabel">🗺 DAY 1만 표시</span><div class="mapmini-actions"><button id="dayonly" class="active">전체 보기</button><button id="mapsize">지도 크게</button></div></div><div id="map"></div>'
          assert old in t
          t = t.replace(old, new)
          t = t.replace('선택 플랜 전체보기','현재 지도 맞춤')
          t = t.replace('OSAKA TRIP V2.1 · MOBILE STICKY MAP','OSAKA TRIP V2.2 · DAY MAP')

          t = t.replace("let mode='usj',route;", "let mode='usj',route,currentDay=0,dayOnly=matchMedia('(max-width:820px)').matches;")
          t = t.replace(".bindPopup(`<b>${p[1]}</b><br><a target=\"_blank\" href=\"https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[2])}&hl=ko\">Google Maps에서 열기 →</a>`)", ".bindPopup(`<b>${p[1]}</b><br><a target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p[2])}&hl=ko\">Google Maps에서 열기 →</a>`,{maxWidth:180,minWidth:120,autoPanPadding:[12,12]})")

          old = "function days(){return mode==='usj'?A:B}function stops(){return days().flatMap(d=>d[2].map(x=>x[1]))}function clear(){document.querySelectorAll('.stop,.marker').forEach(x=>x.classList.remove('active'))}function focus(k,el){clear();if(el)el.classList.add('active');const pin=document.getElementById('pin-'+k);if(pin)pin.classList.add('active');const p=P[k];map.flyTo([p[3],p[4]],k==='kix'?10.5:14,{duration:.5});M[k].openPopup()}"
          new = "function days(){return mode==='usj'?A:B}function stops(){return days().flatMap(d=>d[2].map(x=>x[1]))}function dayStops(i=currentDay){return days()[i]?.[2].map(x=>x[1])||[]}function uniq(a){return [...new Set(a)]}function scopeStops(){return dayOnly?dayStops():stops()}function clear(){document.querySelectorAll('.stop,.marker').forEach(x=>x.classList.remove('active'))}function updateScopeUI(){const label=document.getElementById('daymaplabel'),btn=document.getElementById('dayonly');if(label)label.textContent=dayOnly?`🗺 DAY ${currentDay+1}만 표시`:'🗺 전체 플랜 표시';if(btn){btn.textContent=dayOnly?'전체 보기':'DAY만 보기';btn.classList.toggle('active',dayOnly)}}function updateMarkerVisibility(){const visible=new Set(uniq(scopeStops()));Object.entries(M).forEach(([k,m])=>{const show=!dayOnly||visible.has(k);if(show&&!map.hasLayer(m))m.addTo(map);if(!show&&map.hasLayer(m)){if(m.isPopupOpen())m.closePopup();map.removeLayer(m)}});updateScopeUI()}function focus(k,el){if(el&&el.dataset.day!==undefined){const di=+el.dataset.day;if(di!==currentDay){currentDay=di;if(dayOnly){updateMarkerVisibility();draw()}}}clear();if(el)el.classList.add('active');const pin=document.getElementById('pin-'+k);if(pin)pin.classList.add('active');const p=P[k];if(!map.hasLayer(M[k]))M[k].addTo(map);map.flyTo([p[3],p[4]],k==='kix'?10.5:14,{duration:.45});M[k].openPopup()}"
          assert old in t
          t = t.replace(old, new)

          old = "days().forEach(d=>{const s=document.createElement('div');s.className='day';s.innerHTML=`<div class=\"dayhead\"><h3>${d[0]}</h3><span>${d[1]}</span></div>`;d[2].forEach(x=>{const p=P[x[1]],e=document.createElement('article');e.className='stop';e.dataset.k=x[1];"
          new = "days().forEach((d,di)=>{const s=document.createElement('div');s.className='day';s.dataset.day=di;s.innerHTML=`<div class=\"dayhead\"><h3>${d[0]}</h3><span>${d[1]}</span></div>`;d[2].forEach(x=>{const p=P[x[1]],e=document.createElement('article');e.className='stop';e.dataset.k=x[1];e.dataset.day=di;"
          assert old in t
          t = t.replace(old, new)
          t = t.replace("t.appendChild(s)});draw();fit();google()}", "t.appendChild(s)});updateMarkerVisibility();draw();fit();google();setTimeout(syncDayFromScroll,100)}")

          old = "function uniq(a){return [...new Set(a)]}function fit(){const b=L.latLngBounds(uniq(stops()).map(k=>[P[k][3],P[k][4]])).pad(.15);map.fitBounds(b)}function draw(){if(route)map.removeLayer(route);route=L.polyline(stops().map(k=>[P[k][3],P[k][4]]),{weight:3,opacity:.5,dashArray:'8 8'}).addTo(map)}"
          new = "function fit(){const ss=uniq(scopeStops());if(!ss.length)return;const b=L.latLngBounds(ss.map(k=>[P[k][3],P[k][4]])).pad(dayOnly?.25:.15);map.fitBounds(b,{animate:true,duration:.35})}function draw(){if(route)map.removeLayer(route);const ss=scopeStops();if(ss.length>1)route=L.polyline(ss.map(k=>[P[k][3],P[k][4]]),{weight:3,opacity:.5,dashArray:'8 8'}).addTo(map);else route=null}"
          assert old in t
          t = t.replace(old, new)

          insert = "function setCurrentDay(di,fitMap=true){if(di<0||di>=days().length||di===currentDay)return;currentDay=di;map.closePopup();if(dayOnly){clear();updateMarkerVisibility();draw();if(fitMap)fit()}else updateScopeUI()}let scrollTick=false;function syncDayFromScroll(){if(!dayOnly||!matchMedia('(max-width:820px)').matches)return;const ds=[...document.querySelectorAll('.day')];if(!ds.length)return;const mb=document.querySelector('.mapbox');const target=(mb?.getBoundingClientRect().bottom||300)+28;let best=currentDay,bestDist=Infinity;ds.forEach((el,i)=>{const r=el.getBoundingClientRect();if(r.top<=target&&r.bottom>=target){best=i;bestDist=0}else{const dist=Math.min(Math.abs(r.top-target),Math.abs(r.bottom-target));if(dist<bestDist){best=i;bestDist=dist}}});setCurrentDay(best,true)}addEventListener('scroll',()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{scrollTick=false;syncDayFromScroll()})},{passive:true});"
          anchor = "document.querySelectorAll('.selector button').forEach"
          assert anchor in t
          t = t.replace(anchor, insert + anchor, 1)
          t = t.replace("mode=b.dataset.plan;document.querySelectorAll", "mode=b.dataset.plan;currentDay=0;document.querySelectorAll")
          t = t.replace("Object.entries(M).forEach(([k,m])=>m.on('click',()=>{const e=document.querySelector(`.stop[data-k=\"${k}\"]`);if(e){clear();", "Object.entries(M).forEach(([k,m])=>m.on('click',()=>{const e=document.querySelector(`.stop[data-k=\"${k}\"]`);if(e){const di=+e.dataset.day;currentDay=di;if(dayOnly){updateMarkerVisibility();draw()}clear();")
          t = t.replace("document.getElementById('fit').addEventListener('click',fit);document.getElementById('mapsize')", "document.getElementById('fit').addEventListener('click',fit);document.getElementById('dayonly').addEventListener('click',()=>{dayOnly=!dayOnly;clear();updateMarkerVisibility();draw();fit()});document.getElementById('mapsize')")

          p.write_text(t, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve mobile map with day-only mode" || exit 0
          git push

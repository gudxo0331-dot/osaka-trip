name: Patch V2.7 route guide

on:
  push:
    paths:
      - '.github/workflows/patch-v27-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="options-v26.css"></head>','<link rel="stylesheet" href="options-v26.css"><link rel="stylesheet" href="route-v27.css"></head>')
          s=s.replace('<script src="options-v26.js"></script></body>','<script src="options-v26.js"></script><script src="route-v27.js"></script></body>')
          s=s.replace('OSAKA TRIP V2.6 · STICKY OPTIONS MAP','OSAKA TRIP V2.7 · BEGINNER ROUTE GUIDE')
          if 'route-v27.css' not in s or 'route-v27.js' not in s:
              raise SystemExit('patch failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add beginner origin destination route guide"
          git push
